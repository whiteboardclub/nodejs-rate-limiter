name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC/Trusted Publishers
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          # CRITICAL: registry-url has been removed so OIDC works cleanly

      - name: Upgrade NPM to support Trusted Publishers
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to NPM
        # Added the provenance flag to verify the package source
        run: npm publish --provenance
